version = 1


# === Global preset (applied to ALL models first, then model-specific overrides cascade on top) ===

[*]
# generic
fit = off
warmup = true
jinja = on
offline = true
timeout = 3600
# performance
gpu-layers = all
flash-attn = on
batch-size = 8192
ubatch-size = 2048
load-mode = dio
; verbosity = 5

[qwen-next]
model = /home/LLMs/models/qwen/3.8-Flash-Next/AP-Q4_K_XL/Signal-3.8-Flash-Next-AP-Q4_K_XL.gguf
mmproj = /home/LLMs/models/qwen/3.8-Flash-Next/mmproj-F16.gguf
image-min-tokens = 1024
# sampling
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
# reasoning
reasoning = on
reasoning-preserve = on
reasoning-effort = xhigh
# draft
spec-type = draft-mtp,ngram-mod
spec-draft-ngl = all
spec-draft-model = /home/LLMs/models/qwen/3.8-Flash-Next/Qwen3.8-Flash-Next-MTP-Q8_0.gguf
spec-draft-adaptive = true
spec-draft-n-max = 3
spec-draft-p-min = 0.75
# misc
load-mode = mmap
lazy-mode = on
parallel = 1

