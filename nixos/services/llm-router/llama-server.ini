# For llama-server-api tests

# Smallest test model (Qwen 3.5-4B). `alias` is an additional name the router
# resolves to this model (`server_models::add_model` reads it from the preset's
# --alias option, `tools/server/server-models.cpp`); `GET /models` lists it under
# `aliases` while the canonical `id` stays `test`. Used by the
# `TEST_MODEL_ALIAS` integration tests (model-alias resolution).
[test]
model = /home/LLMs/models/qwen/3.5-4B/IQ4_NL.gguf
ctx-size = 4096
reasoning = off
alias = test-alias

[test-reasoning]
model = /home/LLMs/models/qwen/3.5-4B/IQ4_NL.gguf
ctx-size = 4096
reasoning = on

[test-big]
model = /home/LLMs/models/qwen/3.8-27B/UD-IQ3_XXS.gguf
reasoning = off
ctx-size = 4096

[test-mtp]
