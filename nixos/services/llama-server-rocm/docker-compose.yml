# ROCm router image built by `llama-rocm-image-update` and loaded into llm's rootless daemon.
# Do not use host networking (rootless Docker masks /sys/class/kfd); publish ports.
# Do not add GGML_CUDA_ENABLE_UNIFIED_MEMORY (corrupts output here).

services:
  llm-router-strix:
    image: "${STRIX_IMAGE:?}:latest"
    container_name: llama-server-rocm
    # The image exists only in this daemon's storage, so compose must never pull.
    pull_policy: never
    # systemd owns the lifecycle; a restart policy would race the other engine for the port.
    restart: "no"

    devices:
      - /dev/kfd
      - /dev/dri
    # No group_add: docker resolves group names against the image, which has no render group.
    # The device nodes are world rw, so no supplementary group is needed.

    security_opt:
      - seccomp=unconfined
    shm_size: "${STRIX_SHM_SIZE:-8g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1

    # Published instead of host networking (see the header).
    ports:
      - "${STRIX_PORT:?}:${STRIX_INTERNAL_PORT:?}"

    # bash + /dev/tcp only: the image has no curl. In preset mode the router is ready before a
    # model is loaded.
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/${STRIX_INTERNAL_PORT:?} && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # Weights and preset are mounted at their host paths, so the paths in the preset resolve
    # unchanged. The key is bind-mounted read-only from the unit's state directory.
    volumes:
      - "${STRIX_MODELS_PATH:?}:${STRIX_MODELS_PATH:?}:ro"
      - "${LLAMA_API_KEY_FILE:?}:/run/secrets/llama-api-key:ro"

    environment:
      - "ROCBLAS_USE_HIPBLASLT=1"

    # No -m/-hf on the command line, so the server starts in router mode and serves the preset.
    entrypoint: [ "/usr/local/bin/llama-server" ]
    command:
      - --models-preset
      - "${STRIX_PRESET_PATH:?}"
      - --api-key-file
      - /run/secrets/llama-api-key
      - --host
      - 0.0.0.0
      - --port
      - "${STRIX_INTERNAL_PORT:?}"
      - --webui
      - --metrics
      - --props
      - --slots
      - --perf
